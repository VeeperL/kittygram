version: '3.8'

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: veeper/kittygram_backend:latest
    env_file: .env
    volumes:
      - static:/app/collected_static
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 kittygram_backend.wsgi"

  frontend:
    image: veeper/kittygram_frontend:latest
    volumes:
      - static:/app/frontend_build

  gateway:
    image: veeper/kittygram_gateway:latest
    ports:
      - "8000:80"
    volumes:
      - static:/staticfiles
      - media:/media_files
    depends_on:
      - backend
      - frontend

volumes:
  static:
  media:
  pg_data:
